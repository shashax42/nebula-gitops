# backend 네임스페이스에는 파이프라인이 만든 레지스트리의 이미지만 올라갈 수 있다.
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: nebula-allowed-registry
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: backend
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  validations:
    - expression: >-
        object.spec.containers.all(c, c.image.startsWith('ghcr.io/shashax42/')) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c, c.image.startsWith('ghcr.io/shashax42/')))
      message: backend 네임스페이스는 ghcr.io/shashax42 이미지만 허용됩니다.
