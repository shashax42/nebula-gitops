# backend 네임스페이스에는 파이프라인이 만든 레지스트리의 이미지만 올라갈 수 있다.
# 예외는 플랫폼이 이 네임스페이스에 넣는 두 가지뿐이다.
#   quay.io/strimzi/  : Strimzi 오퍼레이터와 Kafka 브로커 (Nebula-Platform 이 backend 에 설치, data-kafka 의 Kafka CR)
#   docker.io/istio/  : Istio 가 주입하는 사이드카 (staging/prod). 검증 웹훅은 주입(변경) 뒤에 실행되므로 허용해야 파드가 뜬다
apiVersion: policies.kyverno.io/v1
kind: ValidatingPolicy
metadata:
  name: nebula-allowed-registry
spec:
  validationActions: [Deny]
  evaluation:
    background:
      enabled: false
  matchConstraints:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: backend
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE]
        resources: [pods]
  variables:
    - name: allowed
      expression: "['ghcr.io/shashax42/', 'quay.io/strimzi/', 'docker.io/istio/']"
  validations:
    - expression: >-
        object.spec.containers.all(c, variables.allowed.exists(p, c.image.startsWith(p))) &&
        (!has(object.spec.initContainers) || object.spec.initContainers.all(c, variables.allowed.exists(p, c.image.startsWith(p))))
      message: backend 네임스페이스는 ghcr.io/shashax42 이미지(와 플랫폼의 Strimzi·Istio 이미지)만 허용됩니다.
