# staging 클러스터의 App of Apps.
# 서비스는 envs/staging/<디렉터리> 오버레이로 배포한다. 오버레이는 dev 트랙 매니페스트를 그대로 쓰고
# 이미지만 승격된 버전으로 고정하므로, 새 이미지는 dev 에서 검증된 뒤 승격 PR 이 병합돼야 들어온다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../apps
patches:
  - target:
      group: argoproj.io
      kind: ApplicationSet
      name: nebula-services
    patch: |
      - op: replace
        path: /spec/generators/0/git/directories
        value:
          - path: envs/staging/*
