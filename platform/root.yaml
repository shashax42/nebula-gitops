# App of Apps 진입점. Terraform(EKS) 은 platform/envs/<env> 를, local/bootstrap.sh(kind) 는 이 파일(dev)을 적용한다.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nebula-root
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/shashax42/nebula-gitops.git
    targetRevision: main
    path: platform/envs/dev
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  syncPolicy:
    automated: { prune: true, selfHeal: true }
