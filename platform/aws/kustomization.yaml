# 이전 진입점 호환: Nebula-Platform 리팩토링 전 클러스터의 nebula-aws 앱은 이 디렉터리(platform/aws)를 동기화한다.
# 디렉터리 구조를 base/ + envs/<env>/ 로 바꾸면서 여기 매니페스트가 없어지면 ArgoCD 가 모니터링 앱을 prune 하므로,
# dev 오버레이를 그대로 가리켜 둔다. 새 Platform 은 platform/aws/envs/<env> 를 직접 동기화하므로 이 파일을 쓰지 않는다.
# 모든 클러스터가 새 Platform 으로 다시 만들어지면 지워도 된다.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - envs/dev
