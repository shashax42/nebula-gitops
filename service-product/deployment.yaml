apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-product
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-product
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: service-product
    spec:
      serviceAccountName: spring-cloud-kubernetes
      containers:
        - name: service-product
          image: ghcr.io/shashax42/service-product:sha-6a5f289@sha256:be97c5de372ee2c0c0f54d07958de0f5b7e9d01d21189adabc5ac8882ebd0ad6
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: config-product
            - configMapRef:
                name: observability-env
                optional: true
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            limits:
              cpu: 1200m
              memory: 1000Mi
            requests:
              cpu: 600m
              memory: 600Mi