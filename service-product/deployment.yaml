apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-product
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-product
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: service-product
        # staging/prod(Istio)에서 사이드카 주입. Istio 가 없는 환경에서는 아무 효과 없음
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: spring-cloud-kubernetes
      containers:
        - name: service-product
          image: ghcr.io/shashax42/service-product:sha-36bdc86@sha256:af7484a5abff5d132c480d1ab3e0760156c8563730d90c7b785d09c5bb13da15
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: config-product
            # DB·Redis 비밀번호 (Nebula-Platform services.tf 가 환경마다 만든다)
            - secretRef:
                name: secret-product
                optional: true
            - configMapRef:
                name: observability-env
                optional: true
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            limits:
              cpu: 1200m
              memory: 1000Mi
            requests:
              cpu: 600m
              memory: 600Mi