# 이미지 승격: dev → staging, staging → prod
#   CI 는 새 이미지를 dev 트랙(최상위 서비스 디렉터리)에만 쓴다. staging/prod 는 이 워크플로가 연 PR 이 병합돼야 바뀐다.
#   다시 빌드하지 않고, 앞 환경에서 검증된 이미지의 태그와 다이제스트를 그대로 옮긴다.
name: promote

on:
  workflow_dispatch:
    inputs:
      service:
        description: 서비스 디렉터리 이름 (all = 이미지가 있는 전부)
        default: all
      target:
        description: 승격할 환경
        type: choice
        options: [staging, prod]

permissions:
  contents: write        # 승격 브랜치 push
  pull-requests: write   # PR 생성
  actions: write         # 승격 PR 에 validate 실행

concurrency:
  group: promote-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Promote
        env:
          SERVICE: ${{ inputs.service }}
          TARGET: ${{ inputs.target }}
          PROMOTE_SUMMARY: ${{ runner.temp }}/summary.md
        run: |
          ./scripts/promote.sh "$SERVICE" "$TARGET"
          ./scripts/check-envs.sh
          cat "$PROMOTE_SUMMARY" >> "$GITHUB_STEP_SUMMARY"

      - name: Open pull request
        env:
          GH_TOKEN: ${{ github.token }}
          SERVICE: ${{ inputs.service }}
          TARGET: ${{ inputs.target }}
          SUMMARY: ${{ runner.temp }}/summary.md
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if git diff --quiet; then
            echo "승격할 변경이 없습니다 (이미 같은 이미지)." | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          branch="promote/${TARGET}-${SERVICE}-${GITHUB_RUN_ID}"
          git config user.name "nebula-ci[bot]"
          git config user.email "nebula-ci[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "promote(${TARGET}): ${SERVICE}" -m "run: ${RUN_URL}"
          git push origin "$branch"
          {
            echo "앞 환경에서 검증된 이미지를 **${TARGET}** 로 승격합니다. 같은 다이제스트를 옮기며 다시 빌드하지 않습니다."
            echo
            cat "$SUMMARY"
            echo
            echo "병합하면 ${TARGET} 클러스터의 ArgoCD 가 반영합니다. 실행: ${RUN_URL}"
          } > "${RUNNER_TEMP}/body.md"
          gh pr create --base main --head "$branch" --title "promote(${TARGET}): ${SERVICE}" --body-file "${RUNNER_TEMP}/body.md"
          # GITHUB_TOKEN 이 만든 PR 에는 pull_request 워크플로가 돌지 않으므로 필수 검사(validate)를 직접 실행한다
          gh workflow run validate.yml --ref "$branch"
