# 매니페스트 PR 게이트: 쿠버네티스 스키마 검증 (CRD는 스키마가 없으면 건너뜀)
name: validate
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        env:
          KUBECONFORM_VERSION: 0.6.7
        run: |
          curl -sSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz" \
            | tar -xz kubeconform
      - name: Validate manifests
        run: |
          find . -path ./.github -prune -o -path ./local -prune -o \( -name '*.yaml' -o -name '*.yml' \) -print \
            | grep -v -e kind-config -e '/values-[^/]*\.yaml$' \
            | xargs ./kubeconform -summary -ignore-missing-schemas \
                -schema-location default \
                -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
