# replicas 는 브로커 설정 min.insync.replicas(2) 이상이어야 한다.
# 1 이면 acks=all(kafka-clients 3.x 기본값) 쓰기가 NOT_ENOUGH_REPLICAS 로 실패한다.
apiVersion: kafka.strimzi.io/v1
kind: KafkaTopic
metadata:
  name: purchase
  namespace: backend
  labels:
    strimzi.io/cluster: market-message
spec:
  partitions: 1
  replicas: 3
  config:
    retention.ms: 7200000
    segment.bytes: 1073741824
