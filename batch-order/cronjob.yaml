apiVersion: batch/v1
kind: CronJob
metadata:
  name: batch-order-every-2-minutes
  namespace: backend
spec:
  schedule: "*/2 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: batch-order
              image: ghcr.io/shashax42/batch-order:sha-91a6453@sha256:d06887e844d82e578f6f8d1d42f27faf17477f8336fd662ba4c4b5bc880a73d0
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: config-batch-order
                # OTLP 주소 (OTel agent). 잡이 끝날 때 마지막 지표·트레이스를 push 한다
                - configMapRef:
                    name: observability-env
                    optional: true
                - secretRef:
                    name: secret-batch-order
                    optional: true
              env:
                - name: "JOB_NAME"
                  value: "cancelOrderWhereStateIsPendingJob"
          restartPolicy: OnFailure
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: batch-order-every-5-minutes
  namespace: backend
spec:
  schedule: "*/5 * * * *"
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      template:
        spec:
          containers:
            - name: batch-order
              image: ghcr.io/shashax42/batch-order:sha-91a6453@sha256:d06887e844d82e578f6f8d1d42f27faf17477f8336fd662ba4c4b5bc880a73d0
              imagePullPolicy: IfNotPresent
              envFrom:
                - configMapRef:
                    name: config-batch-order
                # OTLP 주소 (OTel agent). 잡이 끝날 때 마지막 지표·트레이스를 push 한다
                - configMapRef:
                    name: observability-env
                    optional: true
                - secretRef:
                    name: secret-batch-order
                    optional: true
              env:
                - name: "JOB_NAME"
                  value: "deleteOrderWhereStateIsCanceledJob"
          restartPolicy: OnFailure