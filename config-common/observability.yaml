# 모든 서비스가 공유하는 관측성 설정.
#   OTLP(트레이스·메트릭) → 같은 노드의 OTel agent (Nebula-Monitoring 차트, Service otel-collector,
#   internalTrafficPolicy=Local). 로그는 stdout JSON 을 agent 가 수집한다.
# 서비스별 config-* ConfigMap(DB·Redis 등)과 분리해 두어, 관측성 설정을 바꿔도 서비스 설정은 건드리지 않는다.
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-env
  namespace: backend
data:
  OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector.monitoring.svc:4318
