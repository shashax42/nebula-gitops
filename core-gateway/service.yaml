# 외부 진입은 ALB Ingress 가 맡는다 (Nebula-Platform charts/nebula-edge).
#   dev            : ALB → core-gateway (target-type ip, 파드로 직접)
#   staging / prod : ALB → istio-ingressgateway → VirtualService → core-gateway
# 그래서 이 서비스는 클러스터 내부용이다.
apiVersion: v1
kind: Service
metadata:
  name: core-gateway
  namespace: backend
  labels:
    app: core-gateway
spec:
  type: ClusterIP
  ports:
    - name: http
      port: 80
      targetPort: 8080
      protocol: TCP
  selector:
    app: core-gateway
