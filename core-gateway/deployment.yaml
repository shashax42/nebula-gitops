apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-gateway
  namespace: backend
  labels:
    app: core-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: core-gateway
        # staging/prod(Istio)에서 사이드카 주입. Istio 가 없는 환경에서는 아무 효과 없음
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: spring-cloud-kubernetes
      containers:
        - name: core-gateway
          image: ghcr.io/shashax42/core-gateway:sha-36bdc86@sha256:1c054fa6100a5838f8168d353090519fe4d203e1a0d0d3289458194198313d4f
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: config-gateway
            # DB·Redis 비밀번호 (Nebula-Platform services.tf 가 환경마다 만든다)
            - secretRef:
                name: secret-gateway
                optional: true
            - configMapRef:
                name: observability-env
                optional: true
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            limits:
              cpu: 1200m
              memory: 1000Mi
            requests:
              cpu: 600m
              memory: 600Mi