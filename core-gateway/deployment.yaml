apiVersion: apps/v1
kind: Deployment
metadata:
  name: core-gateway
  namespace: backend
  labels:
    app: core-gateway
spec:
  replicas: 1
  selector:
    matchLabels:
      app: core-gateway
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: core-gateway
    spec:
      serviceAccountName: spring-cloud-kubernetes
      containers:
        - name: core-gateway
          image: ghcr.io/shashax42/core-gateway:sha-1de94be@sha256:b83da50a273c83ae2fb74fd76bf1b2dd34d7c2a37f5994b4b20c0b2d84488886
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: config-gateway
            - configMapRef:
                name: observability-env
                optional: true
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            limits:
              cpu: 1200m
              memory: 1000Mi
            requests:
              cpu: 600m
              memory: 600Mi