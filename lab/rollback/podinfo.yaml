# 자동 롤백 실험용 앱. PODINFO_RANDOM_ERROR=true면 약 1/3 확률로 500을 반환한다.
# local/demo-rollback.sh가 정상/장애 버전을 번갈아 배포하며 결과를 기록한다.
apiVersion: v1
kind: Namespace
metadata:
  name: rollback-lab
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo-stable
  namespace: rollback-lab
spec:
  selector: { app: podinfo }
  ports: [{ port: 80, targetPort: 9898 }]
---
apiVersion: v1
kind: Service
metadata:
  name: podinfo-canary
  namespace: rollback-lab
spec:
  selector: { app: podinfo }
  ports: [{ port: 80, targetPort: 9898 }]
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: podinfo
  namespace: rollback-lab
spec:
  replicas: 2
  revisionHistoryLimit: 3
  selector:
    matchLabels: { app: podinfo }
  template:
    metadata:
      labels: { app: podinfo }
    spec:
      containers:
        - name: podinfo
          image: ghcr.io/stefanprodan/podinfo:6.15.0
          ports: [{ containerPort: 9898 }]
          env:
            - name: PODINFO_RANDOM_ERROR
              value: "false"
          readinessProbe:
            httpGet: { path: /readyz, port: 9898 }
            periodSeconds: 5
            failureThreshold: 5
  strategy:
    canary:
      stableService: podinfo-stable
      canaryService: podinfo-canary
      steps:
        - setWeight: 50
        - analysis:
            templates:
              - templateName: http-error-rate
                clusterScope: true
            args:
              - name: url
                value: http://podinfo-canary.rollback-lab.svc.cluster.local/
        - setWeight: 100
