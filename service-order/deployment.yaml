apiVersion: apps/v1
kind: Deployment
metadata:
  name: service-order
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-order
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: service-order
    spec:
      serviceAccountName: spring-cloud-kubernetes
      containers:
        - name: service-order
          image: ghcr.io/shashax42/service-order:sha-1de94be@sha256:b069f9f47e0b8f8efc71a72b31c70ee5f7c435cda7ae9897b5b5483f8e721f4e
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: config-order
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            limits:
              cpu: 1200m
              memory: 1000Mi
            requests:
              cpu: 600m
              memory: 600Mi