# 메트릭 기반 카나리: 새 버전 파드에 nebula.io/track=canary 라벨이 붙고, OTel agent 가 이를 deployment.track 으로
# 수집해 canary/stable 의 에러율·P99 를 AMP 에서 따로 계산한다. 분석이 실패하면 Argo Rollouts 가 자동 롤백한다.
#   분석 템플릿: platform/aws/analysis-slo-canary.yaml (AMP 주소가 계정마다 달라 AWS 전용 디렉터리에 둔다)
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: service-order
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-order
  strategy:
    canary:
      canaryMetadata:
        labels:
          nebula.io/track: canary
      stableMetadata:
        labels:
          nebula.io/track: stable
      steps:
        - setWeight: 50
        # 카나리 파드가 기동하고(liveness 60s) 판단할 만큼 요청이 쌓일 시간
        - pause: { duration: 3m }
        - analysis:
            templates:
              - templateName: nebula-slo-canary
                clusterScope: true
            args:
              - name: service
                value: service-order
  template:
    metadata:
      labels:
        app: service-order
    spec:
      serviceAccountName: spring-cloud-kubernetes
      containers:
        - name: service-order
          image: ghcr.io/shashax42/service-order:sha-6a5f289@sha256:12d1cf8b93e73d23c6f5ba6bd37e7f5a571ea45cce51a6ec81eed71a0a6dc263
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: config-order
            - configMapRef:
                name: observability-env
                optional: true
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            limits:
              cpu: 1200m
              memory: 1000Mi
            requests:
              cpu: 600m
              memory: 600Mi