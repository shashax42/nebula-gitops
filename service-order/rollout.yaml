# 메트릭 기반 카나리: 새 버전 파드에 nebula.io/track=canary 라벨이 붙고, OTel agent 가 이를 deployment.track 으로
# 수집해 canary/stable 의 에러율·P99 를 AMP 에서 따로 계산한다. 분석이 실패하면 Argo Rollouts 가 자동 롤백한다.
#   분석 템플릿: platform/aws/base/analysis-slo-canary.yaml (AMP 주소가 계정·환경마다 달라 AWS 전용 오버레이 envs/<env> 로 넣는다)
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: service-order
  namespace: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: service-order
  strategy:
    canary:
      canaryMetadata:
        labels:
          nebula.io/track: canary
      stableMetadata:
        labels:
          nebula.io/track: stable
      steps:
        - setWeight: 50
        # 카나리 파드가 기동하고(liveness 60s) 판단할 만큼 요청이 쌓일 시간
        - pause: { duration: 3m }
        - analysis:
            templates:
              - templateName: nebula-slo-canary
                clusterScope: true
            args:
              - name: service
                value: service-order
  template:
    metadata:
      labels:
        app: service-order
        # staging/prod(Istio)에서 사이드카 주입. Istio 가 없는 환경에서는 아무 효과 없음
        sidecar.istio.io/inject: "true"
    spec:
      serviceAccountName: spring-cloud-kubernetes
      containers:
        - name: service-order
          image: ghcr.io/shashax42/service-order:sha-36bdc86@sha256:2f33ea3354284c97b1d70d1e45c6e05e98d7d07fc24c68883aabe0c8e2b927fb
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: config-order
            # DB·Redis 비밀번호 (Nebula-Platform services.tf 가 환경마다 만든다)
            - secretRef:
                name: secret-order
                optional: true
            - configMapRef:
                name: observability-env
                optional: true
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 60
            periodSeconds: 30
          resources:
            limits:
              cpu: 1200m
              memory: 1000Mi
            requests:
              cpu: 600m
              memory: 600Mi